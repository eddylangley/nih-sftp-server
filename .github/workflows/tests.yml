name: tests

on:
  push:
  pull_request:

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          gcc --version
          python3 --version

      - name: Run test suite (builds normal / ASan / NDEBUG+ASan / draft-spec variants)
        run: python3 tests/run_all.py -v

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gcc -fanalyzer
        run: |
          gcc -fanalyzer -Wall -Wextra -std=iso9899:1999 -c nih-sftp-server.c -o /tmp/analyzer.o

  strict-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        openssh_compat: ["", "-DOPENSSH_COMPAT=0"]
    steps:
      - uses: actions/checkout@v4

      - name: Build with project's own strict flags
        run: |
          gcc -O2 -Wall -Wextra -std=iso9899:1999 -pedantic-errors \
            ${{ matrix.openssh_compat }} nih-sftp-server.c -o /tmp/sftp-server

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs as the non-root "runner" user by default on GitHub-hosted
      # runners, so the EACCES/EPERM-dependent tests (skipped under root -
      # see testutil.skip_if_root) run for real here, not just the rest.
      - name: Measure coverage (gcov)
        run: python3 tests/run_coverage.py

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and bubblewrap
        run: sudo apt-get update && sudo apt-get install -y clang bubblewrap

      - name: Build fuzz harness
        run: |
          clang -O1 -g -fsanitize=fuzzer,address,undefined \
            -std=gnu99 fuzz/fuzz_harness.c -o fuzz/fuzz_harness

      # See fuzz/README.md: this harness drives a real filesystem-touching
      # server with no path sanitization of its own, so it always runs
      # inside bubblewrap - never directly against a real filesystem.
      - name: Run fuzzer (bounded time - see fuzz/README.md for longer runs)
        run: |
          mkdir -p /tmp/nih-sftp-fuzz-scratch
          bwrap --unshare-all --die-with-parent \
            --ro-bind / / \
            --tmpfs /tmp \
            --bind /tmp/nih-sftp-fuzz-scratch /tmp/scratch \
            --chdir /tmp/scratch \
            "$GITHUB_WORKSPACE/fuzz/fuzz_harness" "$GITHUB_WORKSPACE/fuzz/corpus" \
            -max_len=34100 -timeout=5 -max_total_time=120 \
            -artifact_prefix=/tmp/scratch/

      - name: Upload any crash/hang artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: /tmp/nih-sftp-fuzz-scratch/crash-*
          if-no-files-found: ignore
